<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SpecimenLab</title>
<style>
  :root{
    --bg:#0d1117; --panel:#151b23; --panel2:#1b232d; --line:#273140;
    --ink:#e6edf3; --dim:#8b98a5; --faint:#5b6672;
    --accent:#33d6c8; --accent2:#f2b544; --good:#3fb950; --bad:#f85149;
    --mono:ui-monospace,"Cascadia Code","Consolas",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
  header{display:flex;align-items:baseline;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:16px;margin:0;letter-spacing:.5px}
  header h1 b{color:var(--accent)}
  header .sub{color:var(--dim);font-size:12px}
  nav{margin-left:auto;display:flex;gap:4px}
  nav button{background:transparent;color:var(--dim);border:1px solid transparent;padding:6px 14px;border-radius:6px;cursor:pointer;font-family:var(--sans);font-size:13px}
  nav button:hover{color:var(--ink)}
  nav button.on{color:var(--bg);background:var(--accent);font-weight:600}
  .wrap{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 54px)}
  aside{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:14px}
  main{overflow:auto;position:relative}
  .view{display:none;padding:18px;height:100%}
  .view.on{display:block}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--faint);margin:2px 0 10px}
  .sl{margin-bottom:12px}
  .sl label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:3px}
  .sl label .val{color:var(--accent);font-family:var(--mono)}
  .sl input[type=range]{width:100%;accent-color:var(--accent);height:4px}
  .status{margin-top:8px;border-top:1px solid var(--line);padding-top:10px}
  .status .row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;padding:2px 0}
  .status .row span:first-child{color:var(--dim)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .card .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint)}
  .card .v{font-size:26px;font-family:var(--mono);margin-top:6px}
  .card .u{font-size:12px;color:var(--dim)}
  .bar{height:26px;display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--panel2)}
  .bar div{display:flex;align-items:center;justify-content:center;font-size:11px;color:#0d1117;font-family:var(--mono);min-width:0;overflow:hidden;white-space:nowrap}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--dim)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
  .mission{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:18px}
  .crit{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
  .badge{font-family:var(--sans);font-weight:600;padding:2px 8px;border-radius:4px;font-size:11px}
  .badge.met{background:rgba(63,185,80,.18);color:var(--good)}
  .badge.miss{background:rgba(248,81,73,.18);color:var(--bad)}
  svg{width:100%;height:100%;display:block}
  .cap{color:var(--dim);font-size:12px;margin-top:6px}
  text{font-family:var(--mono)}
  .err{color:var(--bad);font-family:var(--mono);white-space:pre-wrap;padding:12px}
  code{color:var(--accent2);font-family:var(--mono)}
</style>
</head>
<body>
<header>
  <h1><b>Specimen</b>Lab</h1>
  <span class="sub">physics-grounded design · live over the real forge engine</span>
  <nav>
    <button data-tab="arch" class="on">Architecture</button>
    <button data-tab="viz">Viz</button>
    <button data-tab="sim">Sim</button>
  </nav>
</header>

<div class="wrap">
  <aside>
    <h2>Design parameters</h2>
    <div id="sliders"></div>
    <div class="status">
      <h2>Live state</h2>
      <div class="row"><span>mass</span><span id="s_mass">–</span></div>
      <div class="row"><span>TWR</span><span id="s_twr">–</span></div>
      <div class="row"><span>a_max</span><span id="s_a">–</span></div>
      <div class="row"><span>endurance</span><span id="s_e">–</span></div>
      <div class="row"><span>solve</span><span id="s_conv">–</span></div>
    </div>
    <div class="status">
      <h2>Mission</h2>
      <div class="sl"><label>min agility <span class="val" id="v_areq">5.0 g</span></label>
        <input type="range" id="m_areq" min="1" max="12" step="0.5" value="5"></div>
      <div class="sl"><label>min top speed <span class="val" id="v_vreq">30 m/s</span></label>
        <input type="range" id="m_vreq" min="10" max="80" step="1" value="30"></div>
      <div class="sl"><label>min endurance <span class="val" id="v_ereq">10 min</span></label>
        <input type="range" id="m_ereq" min="0" max="60" step="1" value="10"></div>
    </div>
  </aside>

  <main>
    <section class="view on" data-tab="arch" id="arch"></section>
    <section class="view" data-tab="viz" id="viz"></section>
    <section class="view" data-tab="sim" id="sim"></section>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const post = (u,b) => fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(r=>r.json());
let cfg={}, bounds={}, spec=null, last=null, tab="arch";
const mission = {a_req:5, v_req:30, endur_req:10};

// ---- boot -----------------------------------------------------------------
async function boot(){
  const c = await fetch("/api/config").then(r=>r.json());
  cfg = {...c.cfg}; bounds = c.bounds;
  buildSliders();
  wireMission();
  wireTabs();
  spec = await post("/api/spec", cfg);
  renderArch();
  await refresh();
}

function buildSliders(){
  const host = $("#sliders"); host.innerHTML="";
  for(const [k,[lo,hi,step,label,unit]] of Object.entries(bounds)){
    const d = document.createElement("div"); d.className="sl";
    d.innerHTML = `<label>${label} <span class="val" id="lab_${k}"></span></label>
      <input type="range" id="in_${k}" min="${lo}" max="${hi}" step="${step}" value="${cfg[k]}">`;
    host.appendChild(d);
    const inp = d.querySelector("input");
    const lab = d.querySelector(".val");
    const show = ()=> lab.textContent = `${(+inp.value).toLocaleString()} ${unit}`;
    show();
    inp.addEventListener("input", ()=>{ cfg[k]=+inp.value; show(); schedule(); });
  }
}

function wireMission(){
  const bind=(id,key,fmt,elLab)=>{ const i=$("#"+id); i.addEventListener("input",()=>{mission[key]=+i.value; $(elLab).textContent=fmt(+i.value); if(tab==="sim") renderSim();}); };
  bind("m_areq","a_req",v=>v.toFixed(1)+" g","#v_areq");
  bind("m_vreq","v_req",v=>v+" m/s","#v_vreq");
  bind("m_ereq","endur_req",v=>v+" min","#v_ereq");
}

function wireTabs(){
  document.querySelectorAll("nav button").forEach(b=>{
    b.addEventListener("click",()=>{
      tab=b.dataset.tab;
      document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
      document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.dataset.tab===tab));
      if(tab==="viz") renderViz(); if(tab==="sim") renderSim(); if(tab==="arch") renderArch();
    });
  });
}

let timer;
function schedule(){ clearTimeout(timer); timer=setTimeout(refresh,120); }
async function refresh(){
  last = await post("/api/solve", cfg);
  renderStatus();
  if(tab==="sim") renderSim();
  if(tab==="viz") renderViz();
}

// ---- left status ----------------------------------------------------------
function renderStatus(){
  if(last.error){ $("#s_conv").innerHTML=`<span style="color:var(--bad)">${last.type}</span>`; return; }
  $("#s_mass").textContent = last.mass.toFixed(2)+" kg";
  $("#s_twr").textContent  = last.TWR.toFixed(2);
  $("#s_a").textContent    = last.a_max_g.toFixed(2)+" g";
  $("#s_e").textContent    = last.endurance_min.toFixed(1)+" min";
  $("#s_conv").innerHTML   = last.converged
    ? `<span class="dot" style="background:var(--good)"></span>converged`
    : `<span class="dot" style="background:var(--accent2)"></span>not settled`;
}

// ---- SIM ------------------------------------------------------------------
function renderSim(){
  const el=$("#sim");
  if(!last){ el.innerHTML=""; return; }
  if(last.error){ el.innerHTML=`<div class="err">solve failed: ${last.type}\n${last.error}</div>`; return; }
  const C=[
    ["mass", last.mass.toFixed(2), "kg"],
    ["thrust-to-weight", last.TWR.toFixed(2), ""],
    ["max accel", last.a_max_g.toFixed(2), "g"],
    ["top speed", last.v_max.toFixed(1), "m/s"],
    ["endurance", last.endurance_min.toFixed(1), "min"],
    ["total thrust", last.thrust.toFixed(1), "N"],
  ];
  const cards = C.map(([k,v,u])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="u">${u}</div></div>`).join("");

  const crit=[
    ["agility", last.a_max_g, mission.a_req, "g", last.a_max_g>=mission.a_req],
    ["top speed", last.v_max, mission.v_req, "m/s", last.v_max>=mission.v_req],
    ["endurance", last.endurance_min, mission.endur_req, "min", last.endurance_min>=mission.endur_req],
  ];
  const allmet = crit.every(c=>c[4]);
  const rows = crit.map(([n,have,req,u,ok])=>
    `<div class="crit"><span>${n}: <b style="color:var(--ink)">${(+have).toFixed(1)}</b> / ${req} ${u} needed</span>
      <span class="badge ${ok?"met":"miss"}">${ok?"MET":"MISSED"}</span></div>`).join("");

  // mass breakdown
  const bd=last.breakdown; const total=last.mass||1;
  const cols={energy:"#33d6c8",propulsion:"#f2b544",structure:"#7c8cff",payload:"#f85149"};
  const order=["energy","propulsion","structure","payload"];
  const segs=order.filter(k=>k in bd).map(k=>{
    const pct=100*bd[k]/total;
    return `<div style="flex:${bd[k]};background:${cols[k]}" title="${k} ${bd[k].toFixed(2)} kg">${pct>9?k:""}</div>`;
  }).join("");
  const leg=order.filter(k=>k in bd).map(k=>`<span><i style="background:${cols[k]}"></i>${k} ${bd[k].toFixed(2)} kg</span>`).join("");

  el.innerHTML=`
    <div class="cards">${cards}</div>
    <div class="mission">
      <h2 style="margin-top:0">Mission — ${allmet?'<span class="badge met">ALL MET</span>':'<span class="badge miss">NOT MET</span>'}</h2>
      ${rows}
    </div>
    <div class="mission">
      <h2 style="margin-top:0">Mass breakdown</h2>
      <div class="bar">${segs}</div>
      <div class="legend">${leg}</div>
    </div>`;
}

// ---- VIZ (to-scale top-down device) ---------------------------------------
function renderViz(){
  const el=$("#viz");
  const R = cfg.D_in*0.0254/2;            // prop radius, m
  const L = cfg.L_arm;                     // arm length, m
  const n = cfg.n_rotors||4;
  const span = 2*(L+R);                    // tip-to-tip, m
  const VB=640, pad=70, scale=(VB-2*pad)/span, cx=VB/2, cy=VB/2;
  const m2 = v => v*scale;
  // X-config arm angles
  const angs=[]; for(let i=0;i<n;i++) angs.push((45 + i*360/n)*Math.PI/180);
  // battery box (visual size grows with pack energy)
  const packWh = cfg.S*3.7*cfg.cap_mAh/1000;
  const bhalf = Math.max(0.03, Math.min(0.10, 0.0022*Math.sqrt(packWh)*1)); // m, clamped
  const frame = Math.max(0.05, 0.30*L);

  let arms="", disks="", labels="";
  angs.forEach(a=>{
    const ex=cx+m2(L)*Math.cos(a), ey=cy+m2(L)*Math.sin(a);
    arms += `<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="var(--faint)" stroke-width="6" stroke-linecap="round"/>`;
    disks += `<circle cx="${ex}" cy="${ey}" r="${m2(R)}" fill="rgba(51,214,200,.10)" stroke="var(--accent)" stroke-width="2"/>
              <circle cx="${ex}" cy="${ey}" r="3" fill="var(--accent)"/>`;
  });
  const s10=m2(0.1);
  el.innerHTML=`
   <svg viewBox="0 0 ${VB} ${VB}" role="img" aria-label="top-down scale drawing of the drone">
     <defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
       <path d="M40 0H0V40" fill="none" stroke="var(--line)" stroke-width="1"/></pattern></defs>
     <rect width="${VB}" height="${VB}" fill="url(#g)"/>
     ${arms}
     <rect x="${cx-m2(frame)}" y="${cy-m2(frame)}" width="${m2(2*frame)}" height="${m2(2*frame)}"
           rx="8" fill="var(--panel2)" stroke="var(--line)" stroke-width="2"/>
     <rect x="${cx-m2(bhalf)}" y="${cy-m2(bhalf)}" width="${m2(2*bhalf)}" height="${m2(2*bhalf)}"
           rx="4" fill="rgba(242,181,68,.18)" stroke="var(--accent2)" stroke-width="1.5"/>
     <text x="${cx}" y="${cy+4}" text-anchor="middle" fill="var(--accent2)" font-size="11">${packWh.toFixed(0)} Wh</text>
     ${disks}
     <!-- scale bar -->
     <line x1="${pad}" y1="${VB-30}" x2="${pad+s10}" y2="${VB-30}" stroke="var(--ink)" stroke-width="2"/>
     <line x1="${pad}" y1="${VB-34}" x2="${pad}" y2="${VB-26}" stroke="var(--ink)" stroke-width="2"/>
     <line x1="${pad+s10}" y1="${VB-34}" x2="${pad+s10}" y2="${VB-26}" stroke="var(--ink)" stroke-width="2"/>
     <text x="${pad+s10/2}" y="${VB-38}" text-anchor="middle" fill="var(--dim)" font-size="11">0.10 m</text>
   </svg>
   <div class="cap">${n} rotors · prop ⌀ ${cfg.D_in}" (${(2*R*100).toFixed(1)} cm) ·
     arm ${(L*100).toFixed(0)} cm · tip-to-tip span ${(span*100).toFixed(0)} cm ·
     ${last?("mass "+last.mass.toFixed(2)+" kg"):""}. Drawn to scale.</div>`;
}

// ---- ARCHITECTURE (subsystem graph) ---------------------------------------
function renderArch(){
  const el=$("#arch");
  if(!spec){ el.innerHTML=""; return; }
  const tops = spec.subsystems.filter(s=>s.parent===null);
  const byName = Object.fromEntries(spec.subsystems.map(s=>[s.name,s]));
  const W=980, colY=70, boxW=190, boxH=104, gap=(W-tops.length*boxW)/(tops.length+1);
  const pos={};
  tops.forEach((s,i)=>{ pos[s.name]={x:gap+i*(boxW+gap), y:colY}; });

  // node box html
  function box(s,x,y,w,h){
    const g=s.grounding||{};
    const node = s.node ? s.node : (s.function==="mass" ? "primitive (no law)" : "—");
    const alts=(g.alts||[]).slice(0,2).map(a=>`${a[0].split(".").pop()} (d=${a[1]})`).join(", ");
    return `
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
      <text x="${x+12}" y="${y+22}" fill="var(--ink)" font-size="14" font-weight="700" style="font-family:var(--sans)">${s.name}</text>
      <text x="${x+12}" y="${y+40}" fill="var(--accent)" font-size="11">"${s.function}"</text>
      <text x="${x+12}" y="${y+58}" fill="var(--dim)" font-size="10">◆ ${s.mechanism||"-"}</text>
      <text x="${x+12}" y="${y+74}" fill="var(--faint)" font-size="9.5">${node.length>26?node.slice(0,26)+"…":node}</text>
      <text x="${x+12}" y="${y+90}" fill="var(--faint)" font-size="9">budget ${s.radicality_budget}${s.owns.length?" · owns "+s.owns.join(","):""}</text>
      ${alts?`<text x="${x+12}" y="${y+100}" fill="var(--accent2)" font-size="8.5">↝ ${alts}</text>`:""}`;
  }

  // edges among top-level (from spec.edges)
  let edges="";
  const seen={};
  spec.edges.forEach(([a,b,q])=>{
    const pa=pos[a], pb=pos[b]; if(!pa||!pb) return;
    const ax=pa.x+boxW, ay=pa.y+boxH/2, bx=pb.x, by=pb.y+boxH/2;
    // stack multiple edges between same pair
    const key=a+">"+b; seen[key]=(seen[key]||0)+1; const off=(seen[key]-1)*16;
    const forward = bx>=ax;
    const sx=forward?ax:pa.x, ex=forward?bx:pb.x+boxW;
    const my=(ay+by)/2 - 40 - off;
    const path=`M ${sx} ${ay} C ${(sx+ex)/2} ${my}, ${(sx+ex)/2} ${my}, ${ex} ${by}`;
    edges+=`<path d="${path}" fill="none" stroke="var(--faint)" stroke-width="1.5" marker-end="url(#ah)"/>
            <text x="${(sx+ex)/2}" y="${my+ (by>my?-4:14)}" text-anchor="middle" fill="var(--dim)" font-size="10">${q}</text>`;
  });

  // top-level boxes
  let boxes = tops.map(s=>box(s,pos[s.name].x,pos[s.name].y,boxW,boxH)).join("");

  // children (recursion) drawn below their parent
  let kids="";
  tops.forEach(s=>{
    const ch=spec.subsystems.filter(c=>c.parent===s.name);
    if(!ch.length) return;
    const p=pos[s.name];
    const cw=170, chh=92, cy0=p.y+boxH+56;
    ch.forEach((c,j)=>{
      const cx=p.x-10+j*(cw-70);
      // connector parent -> child
      kids+=`<path d="M ${p.x+boxW/2} ${p.y+boxH} L ${cx+cw/2} ${cy0}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>`;
      kids+=box(c,cx,cy0,cw,chh);
    });
    kids+=`<text x="${p.x+boxW/2}" y="${p.y+boxH+40}" text-anchor="middle" fill="var(--faint)" font-size="10">decomposes into ▾</text>`;
  });

  const H=460;
  el.innerHTML=`
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="subsystem architecture graph">
      <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
        <path d="M0 0 L7 3 L0 6 z" fill="var(--faint)"/></marker></defs>
      ${edges}${boxes}${kids}
    </svg>
    <div class="cap">Each box is a <b>subsystem</b> delivering a physical <code>"function"</code>, realized by an active
    <code>◆ mechanism</code> grounded to a physics-library node. Arrows are <b>couplings</b> — the physical quantity one
    subsystem provides to another. <code>↝</code> marks mechanism crossings radicality permits within the budget.</div>`;
}

boot();
</script>
</body>
</html>
